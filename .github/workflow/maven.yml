
name: Electricity Bill Calculator - JUnit Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  junit-tests:
    name: Run JUnit 5 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test
