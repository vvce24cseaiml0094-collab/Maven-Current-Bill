
name: Electricity Bill Calculator CI CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # RECTANGLE 1: Run JUnit Tests
  run-tests:
    name: Run JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean verify

  # RECTANGLE 2: Build and Publish Docker Image
  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/electricity-bill-calculator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/electricity-bill-calculator:${{ github.sha }}
